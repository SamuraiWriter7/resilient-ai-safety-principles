name: Validate Resilient AI Safety Principles

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resilient-ai-safety-validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show Python version
        run: python --version

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check v0.1 required files
        run: |
          test -f schemas/safety-assessment.schema.json
          test -d examples/pass
          test -d examples/fail

      - name: Check v0.2 schemas
        run: |
          test -f schemas/authority-envelope.schema.json
          test -f schemas/containment-receipt.schema.json
          test -f schemas/verification-record.schema.json
          test -f schemas/recovery-receipt.schema.json

      - name: Check v0.2 example directories
        run: |
          test -d examples/v0.2/pass
          test -d examples/v0.2/fail

      - name: Check validator
        run: |
          test -f scripts/validate_examples.py
          python -m py_compile scripts/validate_examples.py

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [
              Path("schemas"),
              Path("examples/pass"),
              Path("examples/fail"),
              Path("examples/v0.2/pass"),
              Path("examples/v0.2/fail"),
          ]

          files = []

          for root in roots:
              if root.exists():
                  files.extend(sorted(root.rglob("*.json")))

          if not files:
              raise SystemExit("No JSON files found.")

          for path in files:
              try:
                  with path.open("r", encoding="utf-8") as handle:
                      json.load(handle)
              except Exception as exc:
                  raise SystemExit(
                      f"Invalid JSON: {path}: {exc}"
                  ) from exc

              print(f"[json-ok] {path}")

          print()
          print(f"JSON files checked: {len(files)}")
          PY

      - name: Validate v0.1 and v0.2 examples
        run: python scripts/validate_examples.py
