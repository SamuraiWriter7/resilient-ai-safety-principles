name: Validate Windmill Safety Bridge v0.6
on:
  push:
    paths: ["windmill-safety-v0.6/**", ".github/workflows/windmill-safety-v0.6.yml"]
  pull_request:
    paths: ["windmill-safety-v0.6/**", ".github/workflows/windmill-safety-v0.6.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python windmill-safety-v0.6/scripts/validate.py
